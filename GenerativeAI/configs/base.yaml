dataset:
  mnist:
    path: ./data/mnist
  cifar10:
    path: ./data/cifar10

model:
  vae:
    latent_dim: 32
    hidden_dim: 256
    learning_rate: 1e-3
    num_epochs: 50
    batch_size: 128
  
  gan:
    latent_dim: 100
    learning_rate: 2e-4
    betas: [0.5, 0.999]
    num_epochs: 100
    batch_size: 128
  
  diffusion:
    model_name: runwayml/stable-diffusion-v1-5
    num_inference_steps: 50
    guidance_scale: 7.5

training:
  device: cuda
  save_interval: 10

evaluation:
  fid_batch_size: 50
  num_samples: 1000