experiment:
  name: "prompt_cot_medqa"
  seed: 42
  description: "Chain-of-Thought思维链Prompt在MedQA上的效果"

prompt:
  strategy: "cot"
  template: |
    你是一位专业的医疗助手。请按以下步骤思考：
    1. 分析问题
    2. 思考可能的诊断
    3. 选择最可能的答案
    
    问题：{question}
    选项：{options}
    
    让我们一步步思考...
    步骤1：
    步骤2：
    步骤3：
    最终答案：

model:
  name: "TinyLlama-SFT-merged"
  path: "c:/Users/17456/Documents/GitHub/Deep_learningPractice/Few-Shot  Meta-Learning/models/TinyLlama-SFT-merged"
  torch_dtype: "bfloat16"
  device: "cuda"
  max_new_tokens: 512
  temperature: 0.0

data:
  name: "medqa"
  path: "data/processed/medqa_processed.jsonl"
  num_samples: 200
  split: "test"

evaluation:
  metrics: ["accuracy", "hallucination_rate", "reasoning_quality"]
  compare_with: ["zero_shot", "few_shot"]

output:
  save_dir: "results"
  save_responses: true
