defaults:
  - base

experiment:
  name: "expA_resnet"
  seed: 42
  repeat_times: 3
  device: "cuda"
  num_workers: 0

data:
  train_ways: 5
  train_shots: 1
  train_queries: 15
  test_ways: 5
  test_shots: 1
  test_queries: 15

model:
  type: "protonet"
  backbone: "resnet18"
  hidden_size: 64
  embedding_dim: 512
  num_layers: 4

training:
  method: "meta"
  meta_lr: 0.0005
  fast_lr: 0.4
  epochs: 100
  meta_batch_size: 8
