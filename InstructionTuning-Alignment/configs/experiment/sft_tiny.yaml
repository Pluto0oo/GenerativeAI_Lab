# SFT 随机初始化小模型配置（无需网络下载，验证Pipeline流程）
# 使用GPT-2架构的tiny版本，随机初始化

experiment:
  name: "sft_random_tiny"
  seed: 42
  repeat_times: 1
  description: "SFT随机初始化小模型验证实验（无需预训练权重）"

data:
  name: "alpaca_cleaned"
  path: "data/processed/alpaca_cleaned"
  format: "json"
  max_length: 256
  train_test_split: 0.9
  num_workers: 0
  preprocessing:
    chat_template: false
    truncation: true
    padding: "right"

model:
  name: "random://gpt2-tiny"
  random_init: true
  torch_dtype: "float32"
  device: "cuda"
  pretrained: false
  lora:
    enabled: true
    r: 8
    lora_alpha: 16
    lora_dropout: 0.05
    target_modules: ["c_attn", "c_proj"]
  quantization:
    enabled: false

training:
  method: "sft"
  epochs: 2
  batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-3
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  gradient_checkpointing: false
  save_steps: 50
  eval_steps: 50
  logging_steps: 2

evaluation:
  metrics: ["accuracy", "bleu", "length"]
  eval_dataset: "validation"
  generation:
    max_new_tokens: 64
    temperature: 0.7
    top_p: 0.9
    do_sample: true

logging:
  use_wandb: false
  log_level: "INFO"

output:
  save_dir: "results"
  save_best_model: false
  save_total_limit: 1
