# SFT 指令微调实验配置 - LLaMA-3

experiment:
  name: "sft_llama3_instruct"
  seed: 42
  repeat_times: 3
  description: "LLaMA-3-8B-Instruct 指令微调实验，使用 Alpaca 数据集"

data:
  name: "alpaca_cleaned"
  path: "data/processed/alpaca_cleaned"
  format: "json"
  max_length: 2048
  train_test_split: 0.95
  num_workers: 4
  preprocessing:
    chat_template: true
    truncation: true
    padding: "right"
    # 针对LLaMA的特殊处理
    eos_token: "<|end_of_text|>"
    bos_token: "<|begin_of_text|>"

model:
  name: "meta-llama/Meta-Llama-3-8B-Instruct"
  torch_dtype: "bfloat16"
  device: "cuda"
  pretrained: true
  lora:
    enabled: true
    r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  quantization:
    enabled: false  # 建议在显存不足时开启
    bits: 4
    method: "NF4"

training:
  method: "sft"
  epochs: 3
  batch_size: 4  # 根据GPU显存调整
  gradient_accumulation_steps: 8  # 有效batch = 4 * 8 = 32
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  gradient_checkpointing: true
  save_steps: 500
  eval_steps: 200
  logging_steps: 10
  # DeepSpeed配置（可选）
  deepspeed_config: null

evaluation:
  metrics: ["accuracy", "bleu", "rouge", "length"]
  eval_dataset: "validation"
  generation:
    max_new_tokens: 512
    temperature: 0.7
    top_p: 0.9
    do_sample: true

logging:
  use_wandb: false  # 设置为true以启用W&B追踪
  wandb_project: "alignment-lab"
  wandb_entity: "researcher"
  log_level: "INFO"

output:
  save_dir: "results"
  save_best_model: true
  save_total_limit: 3
